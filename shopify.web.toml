name = "viewer-3d"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks/app/uninstalled"

[commands]
predev = "npm exec prisma generate"
# No `prisma migrate deploy` here: the datasource is MongoDB, whose connector
# has no migrations — the command hard-fails and takes the whole dev session
# with it. Schema changes (and the indexes) are applied with `npm run setup`
# (`prisma db push`) instead.
dev = "npm exec react-router dev"
